##############################################
# WP Host Manager Configuration
##############################################

# PHP
PHP_VERSION=8.5
PHP_SERVICE=php8.5-fpm

# Web Server
NGINX_SERVICE=nginx
NGINX_AVAILABLE=/etc/nginx/sites-available
NGINX_ENABLED=/etc/nginx/sites-enabled

# PHP-FPM Pools
PHP_POOL_DIR=/etc/php/8.5/fpm/pool.d

# MariaDB
DB_SERVICE=mariadb
MYSQL_HOST=localhost

# WordPress
WEB_ROOT=/home
SITE_LIST=/opt/wp-host/sites.list

# Backups
BACKUP_DIR=/opt/wp-host/backups
BACKUP_RETENTION_DAYS=15

# Logs
LOG_DIR=/opt/wp-host/logs

# SSL
SSL_DIR=/etc/letsencrypt/live
LETSENCRYPT_EMAIL=alexmorsh2010@gmail.com

# Templates
TEMPLATE_DIR=/opt/wp-host/templates

# Scripts
SCRIPT_DIR=/opt/wp-host/scripts

# Configuration
CONFIG_DIR=/opt/wp-host/config

# Default WordPress
WP_LOCALE=en_US
WP_ADMIN_USER=admin

# Default Permissions
DIR_PERMISSION=755
FILE_PERMISSION=644

##############################################
# End of Configuration
##############################################
